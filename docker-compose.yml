services:
  chroma-homepage:
    build: .
    container_name: chroma-homepage
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      CHROMA_SECRET_KEY: ${CHROMA_SECRET_KEY:-}
    volumes:
      - chroma-data:/data

volumes:
  chroma-data:
